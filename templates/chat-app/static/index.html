<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HackGlobal Chat App</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f6f4; color: #1a1a1a; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; height: 100vh; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #1a1a1a; color: #fff; }
    .assistant { align-self: flex-start; background: #fff; border: 1px solid #e2e2de; }
    .error { align-self: center; color: #b00020; font-size: 14px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; }
    button { padding: 12px 18px; border: 0; border-radius: 10px; background: #1a1a1a; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <main>
    <h1>HackGlobal Chat App</h1>
    <div id="log"></div>
    <form id="form">
      <input id="input" placeholder="Ask anything..." autocomplete="off" required />
      <button id="send">Send</button>
    </form>
  </main>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = [];

    function add(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", text);
      messages.push({ role: "user", content: text });
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Something went wrong");
        add("assistant", data.reply);
        messages.push({ role: "assistant", content: data.reply });
      } catch (err) {
        add("error", err.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
